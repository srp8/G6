[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicodex"
version = "0.2.0"
description = "A small, reproducible AI coding agent: a scaled-down model of an enterprise Codex workflow, with routing, guardrails and evaluation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MIST 7400E Group 6" }]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
notebook = ["pandas>=2.0", "matplotlib>=3.8", "notebook>=7.0", "nbconvert>=7.0", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
minicodex = "minicodex.cli:main"
minicodex-bench = "minicodex.bench:main"
minicodex-report = "minicodex.report:main"

[tool.setuptools.packages.find]
include = ["minicodex*"]

[tool.pytest.ini_options]
# Only collect the project's own tests. The repos under benchmark/suites/
# contain intentionally failing tests (that's the benchmark!).
testpaths = ["tests"]
norecursedirs = ["benchmark", ".venv", "results", "notebooks"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["benchmark/suites", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["SIM108"]
