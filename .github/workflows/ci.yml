name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and end-to-end tests (mock backend, offline)
        run: pytest -q
      - name: Benchmark smoke run (mock backend, offline)
        run: minicodex-bench --suite custom --output-dir /tmp/mock-run
